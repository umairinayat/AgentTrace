site_name: AgentTrace
site_url: https://agenttrace.github.io/agenttrace/
site_description: "Open-source observability for multi-agent AI systems"
repo_url: https://github.com/agenttrace/agenttrace
repo_name: agenttrace/agenttrace

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Integrations:
      - LangChain: integrations/langchain.md
      - LangGraph: integrations/langgraph.md
      - CrewAI: integrations/crewai.md
      - AutoGen: integrations/autogen.md
      - OpenAI SDK: integrations/openai_sdk.md
      - Ollama: integrations/ollama.md
  - Features:
      - Drift Detection: drift-detection.md
      - Configuration: configuration.md
  - Reference:
      - API Reference: api-reference.md
      - Deployment: deployment.md
      - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agenttrace/agenttrace
